<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>relay-panel</title>
    <script>
      // 页面加载前应用主题: 用户偏好 > 系统偏好，避免闪烁
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved ? saved === 'dark' : systemDark;
          var root = document.documentElement;
          if (dark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      body {
        margin: 0;
        background-color: #f3f5f9;
        overscroll-behavior: none;
      }
      html.dark body {
        background-color: #0b0e15;
      }
      * { box-sizing: border-box; }
    </style>
    <meta name="description" content="中转转发管理面板" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link href="/favicon.ico" rel="icon" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
